<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maple Hollow</title><link rel="stylesheet" href="/town.css"><script type="module" src="/town.js"></script><script type="module" src="/audio.js"></script></head>
<body>
<header><h1>Maple Hollow</h1><div class="clock"><strong id="date">Opening town…</strong><progress id="day" max="1" value="0"></progress><span id="phase" role="status">Connecting…</span></div><div class="controls" aria-label="Local playback"><button id="pause" aria-pressed="false">Pause</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="4" aria-pressed="false">4×</button><button data-speed="12" aria-pressed="false">12×</button><button id="live" type="button" disabled>Live</button></div><span id="market"></span><div class="header-actions"><button id="light" type="button" aria-label="Lighting mode: automatic" title="Cycle automatic, daylight, and evening">Auto light</button><button id="sound" type="button" aria-label="Background music" aria-pressed="true">Mute</button><details id="music-settings"><summary>Tracks</summary><div class="music-options"><label>Track on repeat<select id="music-track"></select></label><label>Music volume<input id="music-volume" type="range" min="0" max="1" step=".01"></label></div></details><button id="ranking" aria-expanded="false" aria-controls="resident">Leaderboard</button><button id="toggle" aria-expanded="false" aria-controls="world">Technical view</button></div></header>
<main><section id="map" aria-label="Maple Hollow town map"><canvas id="town" tabindex="0" aria-label="Town map. Use arrow keys to pan and plus or minus to zoom."></canvas><div id="district-pins" aria-label="Town streets" hidden></div><div id="place-markers" role="group" aria-label="Street entrances" hidden></div><output id="room-occupants" hidden></output><div class="street-story" id="street-story" hidden><div class="street-story-actions"><button id="street-resident" type="button"></button><button id="street-follow" type="button">Follow</button></div><div id="street-activity" aria-live="polite"></div><a id="street-decision" class="decision-link" hidden>View decision</a></div><div class="map-tools"><div class="camera-controls" aria-label="Map controls"><span id="street-name"></span><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-level" aria-label="Map zoom">2×</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="inside" hidden>Step outside</button><button id="street" aria-pressed="true">Street</button><button id="overview" aria-pressed="false">Overview</button></div></div></section><aside id="district-panel" aria-label="Street overview" hidden></aside><aside id="place" aria-label="Place details" hidden></aside><aside id="resident" aria-label="Resident panel" hidden></aside><aside id="world" aria-labelledby="world-title" hidden><div class="panel-heading"><h2 id="world-title">Technical view</h2><button id="close-world" type="button">Back to town</button></div><div id="world-live"></div></aside></main>
</body></html>
