<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maple Hollow</title><link rel="stylesheet" href="/town.css"><script type="module" src="/town.js"></script><script type="module" src="/audio.js"></script></head>
<body>
<header><h1>Maple Hollow</h1><div class="clock"><strong id="date">Opening town…</strong><progress id="day" max="1" value="0"></progress></div><div class="controls" aria-label="Local playback"><button id="pause" aria-pressed="false">Pause</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="4" aria-pressed="false">4×</button><button data-speed="12" aria-pressed="false">12×</button><button id="live" type="button" disabled>Live</button></div><span id="market"></span><div class="header-actions"><button id="light" type="button" aria-label="Lighting mode: automatic" title="Cycle automatic, daylight, and evening">Auto light</button><button id="sound" type="button" aria-label="Background music" aria-pressed="true">Mute</button><button id="ranking" aria-expanded="false" aria-controls="resident">Leaderboard</button><button id="toggle" aria-expanded="false" aria-controls="world">World</button></div></header>
<main><section id="map" aria-label="Maple Hollow town map"><canvas id="town" tabindex="0" aria-label="Town map. Use arrow keys to pan and plus or minus to zoom."></canvas><div class="street-story" id="street-story" hidden><button id="street-resident" type="button"></button><div id="street-activity" aria-live="polite"></div></div><div class="map-tools"><span id="phase">Connecting to shared world</span><div class="camera-controls" aria-label="Map controls"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-level" aria-label="Map zoom">2×</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="inside" hidden>Step outside</button><button id="street" aria-pressed="true">Street</button><button id="overview" aria-pressed="false">Overview</button></div></div></section><aside id="place" aria-label="Place details" hidden></aside><aside id="resident" aria-label="Resident panel" hidden></aside><aside id="world" aria-labelledby="world-title" hidden><div class="panel-heading"><h2 id="world-title">Shared world</h2><button id="close-world" type="button" aria-label="Close world dashboard">Close</button></div><div id="world-live"></div><section><h3>World history</h3><p>Past months are unavailable in this view.</p><h3>Hall of Fame</h3><p>All-time rankings are unavailable in this view.</p></section></aside></main>
</body></html>
