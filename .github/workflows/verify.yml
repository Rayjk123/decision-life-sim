# The same quality gate as `npm run verify` locally (see docs/LOOP.md): types, tests, heuristic eval regression,
# sim health + time budget, docs in sync, leak scan. No decision model is needed; model evals stay manual.
name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify -- --all
        env:
          REPLAY_EVIDENCE_DIR: world/replay-evidence
      - name: Upload replay verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-replay-verification-node-${{ matrix.node }}
          path: world/replay-evidence/
          if-no-files-found: ignore
